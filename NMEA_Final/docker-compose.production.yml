name: frost_nmea2k
services:
  web:
    image: fraunhoferiosb/frost-server:latest
    environment:
      # Reference complete des options : https://fraunhoferiosb.github.io/FROST-Server/settings/settings.html
      - serviceRootUrl=https://nmea2k.obsea.es/FROST-Server
      - plugins_modelLoader_enable=true
      - plugins_multiDatastream_enable=false
      - plugins_actuation_enable=false
      - http_cors_enable=true
      - http_cors_allowed_origins=*
      - persistence_db_driver=org.postgresql.Driver
      - persistence_db_url=jdbc:postgresql://database:5432/sensorthings
      - persistence_db_username=sensorthings
      - persistence_db_password=sensorthings
      - persistence_autoUpdateDatabase=true
    ports:
      # PRODUCTION : n'expose FROST-Server que sur localhost, le reverse
      # proxy Apache (deja en HTTPS pour nmea2k.obsea.es, ajoute par
      # setup_admin.sh) le rend accessible au monde en HTTPS.
      - "127.0.0.1:8080:8080"
    depends_on:
      database:
        condition: service_healthy
    restart: always

  database:
    image: postgis/postgis:16-3.4-alpine
    environment:
      - POSTGRES_DB=sensorthings
      - POSTGRES_USER=sensorthings
      - POSTGRES_PASSWORD=sensorthings
    volumes:
      - postgis_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d sensorthings -U sensorthings"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: always

volumes:
  postgis_volume:
